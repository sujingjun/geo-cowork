version: 1.0
name: "Superpowers TDD Workflow"

instruction: |
  ## 核心规则（不可违反）
  
  ### 规则 1：TDD 循环强制执行
  - 每个 task 必须按 RED → GREEN → REFACTOR 顺序执行
  - RED：先写测试，运行测试确保失败（红色）
  - GREEN：写最少代码让测试通过（绿色）
  - REFACTOR：重构代码，保持测试绿色
  - **禁止**：跳过 RED 阶段直接写实现代码
  
  ### 规则 2：子代理隔离
  - 每个 task 由独立的 subagent 执行
  - 子代理之间不共享上下文
  - 每个子代理只关注当前 task 的输入和输出
  
  ### 规则 3：审查门禁
  - 每个 task 完成后必须通过两级审查
  - 规格审查员：逐行对比代码和 spec 是否一致
  - 质量审查员：检查代码质量、测试覆盖率、编码规范
  
  ### 规则 4：验证证据
  - 每个 task 必须附带测试运行截图/日志
  - 测试覆盖率必须 ≥ 80%（新代码）
  - 所有测试必须通过（绿色）才能进入下一 task

  ## 任务拆分规范
  - 每个 task 必须是 2-5 分钟可完成的原子操作
  - 一个 task 只做一件事（单一职责）
  - task 之间通过文件/接口契约传递数据
  - 禁止在单个 task 中混合 RED+GREEN

  ## 输出格式
  每个 task 完成后输出：
  - [x] Task 名称
  - 测试结果：PASS/FAIL + 截图/日志
  - 覆盖率：XX%
  - 审查结果：通过/不通过 + 说明